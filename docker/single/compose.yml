# Single node · dc1 · port 9042
# Run from the repo root:  docker compose -f docker/single/compose.yml up -d
name: cassandra-single

services:
  cassandra:
    image: cassandra:5.0
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: guide-cluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: r1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 200M
    volumes:
      - ../../cql:/cql:ro
      - cassandra-data:/var/lib/cassandra
    networks: [cassandra-net]
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "DESCRIBE KEYSPACES"]
      interval: 15s
      timeout: 10s
      retries: 20

networks:
  cassandra-net:
    name: cassandra-single-net            # joined by docker/bench (NB_NETWORK)

volumes:
  cassandra-data:
    name: cassandra-guide_cassandra-data  # same volume as before the move → data kept
